name: Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: biome just node npm:typescript rust tombi
      - name: Install TypeScript devDependencies
        run: npm ci --prefix typescript/user-agent-classifier
      - name: Run checks
        run: just check
