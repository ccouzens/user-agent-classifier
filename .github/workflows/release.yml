name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: biome just node npm:typescript rust tombi
      - name: Install TypeScript devDependencies
        run: npm ci --prefix typescript/user-agent-classifier
      - name: Run checks
        run: just check
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p user-agent-classifier

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: biome just node npm:typescript rust tombi
      - name: Install TypeScript devDependencies
        run: npm ci --prefix typescript/user-agent-classifier
      - name: Run checks
        run: just check
      - name: Build TypeScript package
        run: just build-ts
      - name: Publish to npm
        working-directory: typescript/user-agent-classifier
        run: npm publish --provenance --access public
