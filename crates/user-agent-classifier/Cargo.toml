[package]
name = "user-agent-classifier"
version.workspace = true
edition.workspace = true
description = "Zero-allocation, regex-free Rust User-Agent classifier for observability — extracts rendering engine, platform, mobile, WebView, bot, and browser."
readme = "../../README.md"
repository.workspace = true
license.workspace = true
keywords = ["browser", "observability", "parser", "user-agent"]
categories = ["parser-implementations", "web-programming"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"], optional = true }

[dev-dependencies]
assert-json-diff = "2.0.2"
serde_json = "1.0.154"

[features]
default = ["serde"]
serde = ["dep:serde"]
